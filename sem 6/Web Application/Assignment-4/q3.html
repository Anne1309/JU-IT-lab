<!DOCTYPE html>
<html>
<head>
    <title>Calculator with History</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }
        input {
            padding: 8px;
            width: 80px;
        }
        button {
            padding: 8px 12px;
            margin: 5px;
        }
        #history {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div>
        <h2>Calculator</h2>
        <input type="number" id="num1">
        <br></br>
        <input type="number" id="num2">
    </div>
    <br><br>
    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">-</button>
    <button onclick="calculate('*')">*</button>
    <button onclick="calculate('/')">/</button>
    <h3 id="result">Result: </h3>
    <h3>Last 5 Calculations</h3>
    <ul id="history"></ul>
    <script>
        let historyList = [];
        function calculate(op) {
            let n1 = parseFloat(document.getElementById("num1").value);
            let n2 = parseFloat(document.getElementById("num2").value);
            let res;
            if (isNaN(n1) || isNaN(n2)) {
                alert("Enter numbers");
                return;
            }
            if (op === '+') res = n1 + n2;
            if (op === '-') res = n1 - n2;
            if (op === '*') res = n1 * n2;
            if (op === '/') res = n1 / n2;
        document.getElementById("result").textContent = "Result: " + res;
            let text = n1 + " " + op + " " + n2 + " = " + res;
            historyList.push(text);
            // keep only last 5
            if (historyList.length > 5) {
                historyList.shift();
            }
            displayHistory();
        }
        function displayHistory() {
            let ul = document.getElementById("history");
            ul.innerHTML = "";
            historyList.forEach(item => {
                let li = document.createElement("li");
                li.textContent = item;
                ul.appendChild(li);
            });
        }
    </script>
</body>
</html>
