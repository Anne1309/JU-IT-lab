<!DOCTYPE html>
<html>
<head>
    <title>Login Session with LocalStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }  
        input {
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>User Login Session</h2>
    <div id="loginSection">
        <input type="text" id="username" placeholder="Enter Username">
        <br><br>
        <button onclick="login()">Login</button>
    </div>
    <div id="welcomeSection" style="display:none;">
        <p id="message"></p>
        <button onclick="logout()">Logout</button>
    </div>
    <script>
        // Check if user already logged in (after refresh)
        window.onload = function() {
            let storedUser = localStorage.getItem("username");

            if (storedUser) {
                showWelcome(storedUser);
            }
        };
        function login() {
            let username = document.getElementById("username").value;

            if (username === "") {
                alert("Please enter username");
                return;
            }
            // Save username in localStorage
            localStorage.setItem("username", username);
            showWelcome(username);
        }
        function showWelcome(username) {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("welcomeSection").style.display = "block";
            document.getElementById("message").innerHTML = "Welcome back, " + username + "!";
        }
        function logout() {
            // Remove username from localStorage
            localStorage.removeItem("username");
            document.getElementById("welcomeSection").style.display = "none";
            document.getElementById("loginSection").style.display = "block";
            document.getElementById("username").value = "";
        }
    </script>
</body>
</html>
