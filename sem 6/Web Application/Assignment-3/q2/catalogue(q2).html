<!DOCTYPE html>
<html>

<head>
    <title>Catalogue</title>
    <style>
        body {
            font-family: Arial;
        }
        
        table {
            border-collapse: collapse;
            width: 80%;
            margin: auto;
        }
        
        th,
        td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }
        
        th {
            background: #4CAF50;
            color: white;
        }
    </style>
</head>

<body>
    <h2 align="center">Book Catalogue</h2>
    <table>
        <tr>
            <th>Book Name</th>
            <th>Author</th>
            <th>Price (₹)</th>
        </tr>
        <tr>
            <td>C and C++</td>
            <td>Anuska Nath</td>
            <td>350</td>
        </tr>
        <tr>
            <td>HTML & CSS</td>
            <td>Kaustav Mondal</td>
            <td>550</td>
        </tr>
        <tr>
            <td>question setting</td>
            <td>Aritra Mondal</td>
            <td>650</td>
        </tr>
        <tr>
            <td>Python Crash Course</td>
            <td>Anish Das</td>
            <td>600</td>
        </tr>
    </table>
</body>

</html>
